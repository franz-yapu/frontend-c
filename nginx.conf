server {
    listen 80;
    server_name _;

    # Compresion: el bundle son ~530 kB de JS+CSS que viajaban SIN COMPRIMIR
    # (unos 11 s en 3G). Gzip los deja en ~150 kB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;
    # Nota: woff2, png, jpg y webp NO se comprimen: ya vienen comprimidos y
    # volver a pasarlos por gzip solo gasta CPU.

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre (main-XXXX.js, styles-XXXX.css, etc.):
    # cambian de nombre en cada build, así que se pueden cachear "para siempre".
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html y rutas del SPA: NUNCA cachear. Así, tras cada despliegue el
    # navegador carga el bundle nuevo sin necesidad de "refresco fuerte"
    # (evita quedarse con una build vieja que apunta a otro backend).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }
}
