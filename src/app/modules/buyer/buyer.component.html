<nav class="bg-white/95 backdrop-blur-md text-gray-800 border-b border-gray-100 z-50 fixed w-full top-0">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">

      <!-- Mobile: Hamburger (Left) -->
      <div class="flex items-center md:hidden w-1/3">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="p-2 text-gray-800 hover:text-primary hover:bg-gray-100 transition-colors rounded-md"
        >
          <svg *ngIf="!isMobileMenuOpen" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-16 6h16" />
          </svg>
          <svg *ngIf="isMobileMenuOpen" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Logo + Nombre (Desktop: Left, Mobile: Center) -->
      <div class="flex justify-center md:justify-start items-center space-x-3 w-1/3 md:w-auto">
        <a routerLink="/" class="flex items-center space-x-3">
          <div class="hidden md:flex h-10 w-10 bg-white rounded-full items-center justify-center p-1 shrink-0 overflow-hidden shadow-sm border border-primary/20">
            <img src="assets/img/caritas/logo.png" alt="Logo" class="max-h-full max-w-full object-contain" />
          </div>
          <span class="font-semibold text-lg tracking-wide text-gray-800">
            <span class="md:hidden uppercase" appTranslate="APP.TITLE_ACCENT">Café</span>
            <span class="hidden md:inline" appTranslate="APP.TITLE_ACCENT">Café</span>
          </span>
        </a>
      </div>

      <!-- Desktop Menu (Center) -->
      <div class="hidden md:flex flex-1 justify-center space-x-8 items-center">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          (click)="setActiveItem(item)"
          class="px-3 py-2 text-base font-semibold tracking-wide transition-all duration-200"
          [ngClass]="
            item.isActive
              ? 'text-primary border-b-2 border-primary'
              : 'text-gray-700 hover:text-primary'
          "
          [appTranslate]="item.translateKey"
        >
          {{ item.name }}
        </a>
      </div>

      <!-- Right: Language + User -->
      <div class="flex justify-end items-center w-1/3 md:w-auto md:space-x-4">

        <!-- Language Dropdown Desktop -->
        <div class="relative hidden md:block">
          <button
            type="button"
            (click)="toggleLanguageDropdown()"
            class="flex text-gray-700 space-x-2 px-3 py-2 text-base font-semibold tracking-wide transition-all hover:text-primary rounded-md items-center"
          >
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
            </svg>
            <span class="hidden lg:block">{{ currentLanguageInfo().name }}</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <!-- Dropdown -->
          <div *ngIf="isLanguageDropdownOpen"
            class="absolute right-0 mt-2 w-44 bg-white border border-primary/40 rounded-md shadow-lg py-1 z-50">
            <button
              *ngFor="let lang of availableLanguages()"
              (click)="changeLanguage(lang.code)"
              class="flex items-center space-x-3 px-4 py-2 text-sm text-gray-700 hover:text-primary hover:bg-gray-100 transition-colors w-full text-left"
              [class.text-primary]="currentLanguage() === lang.code"
            >
              <span class="text-lg">{{ lang.flag }}</span>
              <span>{{ lang.name }}</span>
            </button>
          </div>
        </div>

        <!-- User Info Desktop -->
        <div class="hidden md:flex items-center space-x-3">
          <!-- Avatar -->
          <div class="relative">
            <div class="h-9 w-9 rounded-full bg-primary flex items-center justify-center text-white font-semibold text-sm shadow-md">
              {{ (user?.firstName?.charAt(0) || '') + (user?.lastName?.charAt(0) || '') }}
            </div>
            <div class="absolute -bottom-1 -right-1 h-3 w-3 rounded-full bg-success-500 border-2 border-white"></div>
          </div>
          <!-- Name -->
          <span class="font-semibold text-gray-800 text-sm">
            {{ user?.firstName + ' ' + user?.lastName }}
          </span>
          <!-- Logout -->
          <button
            (click)="logout()"
            class="px-3 py-1.5 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 text-sm font-semibold transition-colors"
            appTranslate="NAV.LOGOUT"
          >
            Cerrar sesión
          </button>
        </div>

        <!-- Mobile: Language icon -->
        <div class="md:hidden flex items-center space-x-1">
          <button
            type="button"
            (click)="toggleLanguageDropdown()"
            class="p-2 text-gray-700 hover:text-primary hover:bg-gray-100 transition-all rounded-md"
          >
            <span class="text-xl">{{ currentLanguageInfo().flag }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden border-t border-gray-100 bg-white shadow-lg">
    <!-- Nav links -->
    <div class="space-y-1 px-3 pt-3 pb-2">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        (click)="setActiveItem(item); toggleMobileMenu()"
        routerLinkActive="text-primary border-primary bg-primary/5"
        class="block px-3 py-2 text-md font-semibold tracking-wide transition-colors border-l-4 text-gray-700 border-transparent hover:text-primary hover:bg-primary/5"
        [appTranslate]="item.translateKey"
      >
        {{ item.name }}
      </a>
    </div>

    <!-- User info + logout mobile -->
    <div class="px-3 py-3 border-t border-gray-100">
      <div class="flex items-center space-x-3 px-2 py-2 mb-2">
        <div class="h-9 w-9 rounded-full bg-primary flex items-center justify-center text-white font-semibold text-sm shadow">
          {{ (user?.firstName?.charAt(0) || '') + (user?.lastName?.charAt(0) || '') }}
        </div>
        <span class="font-semibold text-gray-800 text-sm">
          {{ user?.firstName + ' ' + user?.lastName }}
        </span>
      </div>
      <button
        (click)="logout(); toggleMobileMenu()"
        class="w-full text-left px-3 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 rounded-lg transition-colors"
        appTranslate="NAV.LOGOUT"
      >
        Cerrar sesión
      </button>
    </div>

    <!-- Language selector mobile -->
    <div class="px-3 py-2 border-t border-gray-100">
      <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-1 py-1" appTranslate="NAV.LANGUAGE">
        Idioma
      </div>
      <button
        *ngFor="let lang of availableLanguages()"
        (click)="changeLanguage(lang.code); toggleMobileMenu()"
        class="flex items-center space-x-3 px-3 py-2 text-base text-gray-700 hover:text-primary hover:bg-primary/5 cursor-pointer transition-colors w-full text-left rounded-md"
        [class.text-primary]="currentLanguage() === lang.code"
      >
        <span class="text-lg">{{ lang.flag }}</span>
        <span>{{ lang.name }}</span>
      </button>
    </div>
  </div>
</nav>

<div class="pt-16">
  <router-outlet></router-outlet>
</div>
