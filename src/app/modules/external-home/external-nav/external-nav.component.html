<nav
  class="bg-white/95 backdrop-blur-md text-gray-800 border-b border-gray-100 z-50 fixed w-full top-0"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Mobile: Hamburger Menu (Left) -->
      <div class="flex items-center md:hidden w-1/3">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="p-2 text-gray-800 hover:text-primary hover:bg-gray-100 transition-colors rounded-md"
        >
          <svg
            *ngIf="!isMobileMenuOpen"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16m-16 6h16"
            />
          </svg>
          <svg
            *ngIf="isMobileMenuOpen"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Logo + Nombre (Desktop: Left, Mobile: Center) -->
      <div
        class="flex justify-center md:justify-start items-center space-x-3 w-1/3 md:w-auto"
      >
        <a routerLink="/" class="flex items-center space-x-3">
          <!-- Wrapper circular con fondo blanco -->
          <div
            class="hidden md:flex h-10 w-10 bg-white rounded-full items-center justify-center p-1 shrink-0 overflow-hidden shadow-sm border border-primary/20"
          >
            <img
              src="assets/img/caritas/logo.png"
              alt="Logo"
              class="max-h-full max-w-full object-contain"
            />
          </div>
          <span
            class="font-semibold text-lg tracking-wide uppercase text-gray-800 md:normal-case md:text-gray-800 md:flex"
          >
            <span class="md:hidden">{{ institutionShortName() | uppercase }}</span>
            <span class="hidden md:inline">{{ institutionShortName() }}</span>
          </span>
        </a>
      </div>

      <!-- Desktop Menu (Center) -->
      <div class="hidden md:flex flex-1 justify-center space-x-8 items-center">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          (click)="setActiveItem(item)"
          class="px-3 py-2 text-base font-semibold tracking-wide transition-all duration-200"
          [ngClass]="
            item.isActive
              ? 'text-primary border-b-2 border-primary'
              : 'text-gray-700 hover:text-primary'
          "
          [appTranslate]="item.translateKey"
        >
          {{ item.name }}
        </a>
      </div>

      <!-- Language Dropdown Desktop & Mobile Search/Language (Right) -->
      <div class="flex justify-end items-center w-1/3 md:w-auto md:space-x-6">
        <!-- Search icon for mobile (visual match to image) -->

        <div class="relative hidden md:block">
          <button
            type="button"
            (click)="toggleLanguageDropdown()"
            class="flex text-gray-700 space-x-2 px-3 py-2 text-base font-semibold tracking-wide transition-all hover:text-primary rounded-md items-center"
          >
            <svg
              class="w-4 h-4 mr-1"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"
              ></path>
            </svg>
            <span class="hidden lg:block">{{
              currentLanguageInfo().name
            }}</span>
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          <!-- Dropdown Menu Desktop -->
          <div
            *ngIf="isLanguageDropdownOpen"
            class="absolute right-0 mt-2 w-44 bg-white border border-primary/40 rounded-md shadow-lg py-1 z-50"
          >
            <button
              *ngFor="let lang of availableLanguages()"
              (click)="changeLanguage(lang.code)"
              class="flex items-center space-x-3 px-4 py-2 text-sm text-gray-700 hover:text-primary hover:bg-gray-100 transition-colors w-full text-left"
              [class.text-primary]="currentLanguage() === lang.code"
            >
              <span class="text-lg">{{ lang.flag }}</span>
              <span>{{ lang.name }}</span>
            </button>
          </div>
        </div>

        <!-- Action Buttons Desktop -->
        <div class="hidden md:flex items-center space-x-4 ml-4">
          <a
            routerLink="/login"
            class="text-gray-700 hover:text-primary font-semibold text-sm transition-colors cursor-pointer"
            appTranslate="HOME.HERO.LOGIN_BUTTON"
          >
            Ingresar
          </a>
          <a
            routerLink="/register"
            class="bg-primary hover:bg-secondary text-white px-5 py-2 rounded-lg font-semibold text-sm transition-colors shadow-sm cursor-pointer"
            appTranslate="HOME.HERO.REGISTER_BUTTON"
          >
            Crear Cuenta
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="isMobileMenuOpen"
    class="md:hidden border-t border-gray-100 bg-white shadow-lg"
  >
    <div class="space-y-1 px-3 pt-3 pb-4">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        (click)="setActiveItem(item); toggleMobileMenu()"
        routerLinkActive="text-primary text-md border-primary bg-primary/5"
        class="block px-3 py-2 text-md font-semibold tracking-wide transition-colors border-l-4 text-gray-700 border-transparent hover:text-primary hover:bg-primary/5"
        [appTranslate]="item.translateKey"
      >
        {{ item.name }}
      </a>
    </div>
    <!-- Mobile: Acciones (Ingresar / Crear Cuenta) -->
    <div class="px-3 pt-1 pb-3 border-t border-gray-100">
      <a
        routerLink="/login"
        (click)="toggleMobileMenu()"
        class="block w-full text-center px-4 py-2.5 mb-2 rounded-lg text-gray-700 font-semibold text-sm border border-gray-200 hover:text-primary hover:border-primary/40 hover:bg-primary/5 transition-colors"
        appTranslate="HOME.HERO.LOGIN_BUTTON"
      >
        Ingresar
      </a>
      <a
        routerLink="/register"
        (click)="toggleMobileMenu()"
        class="block w-full text-center px-4 py-2.5 rounded-lg bg-primary text-white font-semibold text-sm hover:bg-secondary transition-colors shadow-sm"
        appTranslate="HOME.HERO.REGISTER_BUTTON"
      >
        Crear Cuenta
      </a>
    </div>
    <div class="px-3 py-2 border-t border-gray-100">
      <div
        class="text-md font-medium text-gray-500 px-1 py-1"
        appTranslate="NAV.LANGUAGE"
      >
        Idioma
      </div>
      <button
        *ngFor="let lang of availableLanguages()"
        (click)="changeLanguage(lang.code); toggleMobileMenu()"
        class="flex items-center space-x-3 px-3 py-2 text-base text-gray-700 hover:text-primary hover:bg-primary/5 cursor-pointer transition-colors w-full text-left rounded-md"
        [class.text-primary]="currentLanguage() === lang.code"
      >
        <span class="text-lg">{{ lang.flag }}</span>
        <span>{{ lang.name }}</span>
      </button>
    </div>
  </div>
</nav>
