<div class="min-h-screen flex flex-col md:flex-row">
  <!-- Sección de imagen (oculta en móviles) -->
  <div class="hidden md:block md:w-1/2 bg-cover bg-center">
    <div class="h-full flex items-center justify-center p-12">
      <div class="text-white text-center max-w-md">
        <div class="mb-2 flex justify-center">
          <div class="bg-white rounded-full">
            <img
              src="assets/img/caritas/logo.png"
              alt="Café Altura"
              class="h-40 md:h-60 w-auto"
            />
          </div>
        </div>
        <h1
          class="text-4xl text-black font-bold mb-4"
          appTranslate="REGISTER.WELCOME"
        >
          ¡Bienvenidos!
        </h1>
      </div>
    </div>
    <!--  <div class="absolute bottom-0 right-0 z-2 w-1/4 max-w-lg">
            <img src="assets/img/der.svg" alt="Granos de café" class="w-full h-auto" />
        </div> -->

    <!-- Imagen decorativa superior izquierda -->
    <!--   <div class="absolute top-10 left-8 z-1 w-1/4 max-w-lg">
            <img src="assets/img/izq.svg" alt="Hoja de café" class="w-full h-auto" />
        </div> -->
  </div>

  <!-- Sección del formulario -->
  <div class="w-full md:w-1/2 flex items-center justify-center md:p-8 bg-white">
    <div class="max-w-md w-full rounded-lg">
      <!-- Botón para volver atrás -->
      <!--    <button (click)="home()" class="flex items-center text-primary ">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Volver atrás
            </button> -->

      <div class="text-center">
        <h2 class="text-3xl font-bold text-black" appTranslate="REGISTER.TITLE">
          Registro
        </h2>
      </div>

      <dynamic-form
        [fields]="PatientsFormFields(catalogs)"
        [initialData]="initiaData"
        [askfor]="onFormCreated"
        (onFormChange)="handleFormChange($event)"
      >
      </dynamic-form>

      <!-- Contenedor de botones -->
      <div class="mx-5 px-2 flex flex-col space-y-4">
        <button
          (click)="save()"
          [disabled]="!formData?.valid || disabled"
          class="w-full py-3 px-5 bg-secondary text-white rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
          appTranslate="REGISTER.REGISTER_BUTTON"
        >
          Registrarse
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de éxito: confirma de forma visible que se envió el correo de
       verificación. Sustituye al toast fugaz + redirección automática. -->
  @if (registered) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-success-100">
        <svg class="h-9 w-9 text-success-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v16H4z" opacity="0" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-black mb-2" appTranslate="REGISTER.SUCCESS_TITLE">¡Registro exitoso!</h3>
      <p class="text-gray-600 mb-1" appTranslate="REGISTER.SUCCESS_MESSAGE">
        Te enviamos un correo de confirmación a:
      </p>
      <p class="font-semibold text-black mb-3 break-all">{{ registeredEmail }}</p>
      <p class="text-sm text-gray-500 mb-6" appTranslate="REGISTER.SUCCESS_HINT">
        Ábrelo y confirma tu cuenta para poder iniciar sesión. Revisa también la carpeta de spam.
      </p>
      <button
        (click)="goToLogin()"
        class="w-full py-3 px-5 bg-secondary text-white rounded-lg"
        appTranslate="REGISTER.GO_TO_LOGIN"
      >
        Ir a iniciar sesión
      </button>
    </div>
  </div>
  }
</div>
