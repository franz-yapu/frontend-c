    <!-- Contenedor del PDF -->
    <div class="bg-white shadow-lg border border-primary overflow-hidden">
      <div class="p-4 border-b border-primary bg-primary/5">
        <h2 class="text-xl font-bold text-primary text-center" appTranslate="REGULATION.PDF.TITLE">
          Documento del Reglamento
        </h2>
      </div>
      
      <!-- Visor de PDF -->
      <div class="w-full h-screen">
        @if (pdfUrl && !pdfError) {
          <iframe 
            [src]="pdfUrl" 
            class="w-full h-full border-0"
            title="Reglamento de la Subasta"
            (load)="onPdfLoad()"
            (error)="onPdfError()">
          </iframe>
        } @else if (pdfError) {
          <div class="flex items-center justify-center h-64">
            <div class="text-center text-danger-600">
              <svg class="w-12 h-12 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
              </svg>
              <p appTranslate="REGULATION.PDF.ERROR">Error al cargar el documento</p>
              <button 
                (click)="loadPdf()"
                class="mt-2 px-4 py-2 bg-primary text-white rounded hover:bg-primary/80 transition-colors"
                appTranslate="REGULATION.PDF.RETRY"
              >
                Reintentar
              </button>
            </div>
          </div>
        } @else {
          <div class="flex items-center justify-center h-64">
            <div class="text-center">
              <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto mb-4"></div>
              <p class="text-gray-600" appTranslate="REGULATION.PDF.LOADING">Cargando documento...</p>
            </div>
          </div>
        }
      </div>
      
      <!-- Botones de descarga -->
      <div class="p-4 border-t border-primary/20 bg-white flex justify-center space-x-4">
        <a 
          [href]="currentPdfPath" 
          target="_blank"
          class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-primary/80 transition-colors flex items-center space-x-2"
          appTranslate="REGULATION.PDF.DOWNLOAD"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span>Descargar PDF</span>
        </a>
      </div>
    </div>

    <!-- Información de contacto -->
    <div class="bg-primary shadow-lg mt-8 p-6 text-white">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-xl font-bold mb-2" appTranslate="REGULATION.CONTACT.TITLE">¿Tienes preguntas?</h3>
          <p class="text-success-100" appTranslate="REGULATION.CONTACT.SUBTITLE">Contáctanos para resolver cualquier duda sobre el reglamento</p>
        </div>
        <a 
          href="mailto:contact@hirrobrothers.com"
          class="bg-white text-primary px-6 py-3 rounded-xl font-semibold hover:bg-success-50 transition-colors"
          appTranslate="REGULATION.CONTACT.BUTTON"
        >
          Contactar
        </a>
      </div>
    </div>

  </div>
  
  <!-- Elementos decorativos -->
  <div class="absolute bottom-0 right-0 z-20 w-1/4 max-w-xs">
    <img src="assets/img/der.svg" alt="Granos de café" class="w-full h-auto" />
  </div>

  <div class="absolute top-10 -left-8 z-10 w-1/4 max-w-xs">
    <img src="assets/img/izq.svg" alt="Hoja de café" class="w-full h-auto" />
  </div>
</div>
