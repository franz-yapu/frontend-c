<div class="min-h-screen flex items-center justify-center p-4 bg-cover bg-center ">

    <!-- Overlay semi-transparente para mejorar legibilidad -->


    <div class="max-w-md w-full p-8 bg-surface rounded-xl shadow-2xl border border-primary/20 relative z-10 transition-all duration-500">
        <!-- Indicador de verificación exitosa -->
        <div *ngIf="tokenVerified"
            class="mb-4 p-3 bg-success-50 border border-success-200 text-success-700 rounded-lg text-center">
            <i class="fas fa-check-circle mr-2" appTranslate="LOGIN.SUCCESS_MESSAGE"></i>
            ¡Cuenta verificada exitosamente!
        </div>

        <div class="text-center mb-8">
            <div class="mb-2 flex justify-center">
                <div class="bg-surface rounded-2xl shadow-lg p-2 overflow-hidden border border-primary/10">
                    <img [src]="(branding$ | async)?.logoUrl || 'assets/img/caritas/logo.png'" alt="Logo" class="h-32 w-auto object-contain" />
                </div>
            </div>
            <h2 class="text-3xl text-primary font-bold" appTranslate="LOGIN.TITLE">Iniciar Sesión</h2>
            <p class="text-content/60 mt-2" appTranslate="LOGIN.SUBTITLE">Accede a tu cuenta para continuar</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Campo Email -->
            <div>
                <label class="block text-content font-medium mb-2" appTranslate="LOGIN.EMAIL_LABEL">Correo
                    Electrónico</label>
                <input type="email" formControlName="email"
                    class="w-full px-4 py-3 bg-surface rounded-xl border border-primary/30 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition text-content"
                    placeholder="tucorreo@ejemplo.com">
                <!-- Mensajes de validación para email -->
                <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
                    class="text-danger-600 text-sm mt-1">
                    <div *ngIf="loginForm.get('email')?.errors?.['required']" appTranslate="LOGIN.EMAIL_REQUIRED">
                        El correo electrónico es requerido
                    </div>
                    <div *ngIf="loginForm.get('email')?.errors?.['email']" appTranslate="LOGIN.EMAIL_INVALID">
                        El correo electrónico no es válido
                    </div>
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-content font-medium" appTranslate="LOGIN.PASSWORD_LABEL">Contraseña</label>
                </div>
                <div class="relative">
                    <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                        class="w-full px-4 py-3 pr-12 bg-surface rounded-xl border border-primary/30 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition text-content"
                        placeholder="••••••••">
                    <button type="button" (click)="togglePasswordVisibility()"
                        class="absolute right-4 top-1/2 -translate-y-1/2 text-primary-600 hover:text-primary-800"
                        [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            @if (showPassword) {
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            } @else {
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            }
                        </svg>
                    </button>
                </div>
                <!-- Mensajes de validación para contraseña -->
                <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
                    class="text-danger-600 text-sm mt-1">
                    <div *ngIf="loginForm.get('password')?.errors?.['required']" appTranslate="LOGIN.PASSWORD_REQUIRED">
                        La contraseña es requerida
                    </div>
                </div>
            </div>

            <!-- Botón de Inicio de Sesión -->
            <button type="submit"
                class="w-full bg-secondary rounded-lg text-white font-bold py-3 px-4 transition duration-200 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="loginForm.invalid" appTranslate="LOGIN.LOGIN_BUTTON">
                Iniciar Sesión
            </button>

            <div class="text-center text-content/60 font-bold text-sm">
                <span appTranslate="LOGIN.NO_ACCOUNT">¿No tienes una cuenta?</span>
                <a routerLink="/register" class="text-secondary font-bold cursor-pointer" appTranslate="LOGIN.REGISTER_LINK">Regístrate</a>
            </div>
        </form>

        <div class="mt-6  text-center">
            <p class="text-xs font-bold text-content/60">
                <span appTranslate="LOGIN.TERMS_TEXT">Al iniciar sesión aceptas nuestros</span>
                <a (click)="regulation()" class="text-primary hover:underline" appTranslate="LOGIN.TERMS_LINK">Términos y
                    Condiciones</a>
            </p>
        </div>
    </div>
    <div class="absolute bottom-0 right-0 z-2 w-1/4 max-w-lg">
        <img src="assets/img/der.svg" alt="Granos de café" class="w-full h-auto" />
    </div>

    <!-- Imagen decorativa superior izquierda -->
    <div class="absolute top-10 left-8 z-1 w-1/4 max-w-lg">
        <img src="assets/img/izq.svg" alt="Hoja de café" class="w-full h-auto" />
    </div>
</div>
