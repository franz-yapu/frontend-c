<div class="min-h-screen flex items-center justify-center p-4 bg-cover bg-center ">

    <!-- Overlay semi-transparente para mejorar legibilidad -->


    <div class="max-w-md w-full p-8 bg-primary rounded-xl  shadow-2xl border border-primary relative z-10">

        <!-- Indicador de verificación exitosa -->
        <div *ngIf="tokenVerified"
            class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-center">
            <i class="fas fa-check-circle mr-2" appTranslate="LOGIN.SUCCESS_MESSAGE"></i>
            ¡Cuenta verificada exitosamente!
        </div>

        <div class="text-center mb-8">
            <div class="mb-2 flex justify-center">
                <div class="bg-white rounded-full shadow-lg">
                    <img src="assets/img/tecab/tecab.svg" alt="Café Altura" class="h-32 md:h-32 w-auto" />
                </div>
            </div>
            <h2 class="text-3xl text-white font-bold text-primary" appTranslate="LOGIN.TITLE">Iniciar Sesión</h2>
            <p class="text-white mt-2" appTranslate="LOGIN.SUBTITLE">Accede a tu cuenta para continuar</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Campo Email -->
            <div>
                <label class="block text-black font-medium mb-2" appTranslate="LOGIN.EMAIL_LABEL">Correo
                    Electrónico</label>
                <input type="email" formControlName="email"
                    class="w-full px-4 py-3  rounded-xl border border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="tucorreo@ejemplo.com">
                <!-- Mensajes de validación para email -->
                <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
                    class="text-red-500 text-sm mt-1">
                    <div *ngIf="loginForm.get('email')?.errors?.['required']" appTranslate="LOGIN.EMAIL_REQUIRED">
                        El correo electrónico es requerido
                    </div>
                    <div *ngIf="loginForm.get('email')?.errors?.['email']" appTranslate="LOGIN.EMAIL_INVALID">
                        Por favor ingresa un correo electrónico válido
                    </div>
                </div>
            </div>

            <!-- Campo Contraseña -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-black font-medium" appTranslate="LOGIN.PASSWORD_LABEL">Contraseña</label>
                </div>
                <input type="password" formControlName="password"
                    class="w-full px-4 py-3 rounded-xl  border border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="••••••••">
                <!-- Mensajes de validación para contraseña -->
                <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
                    class="text-red-500 text-sm mt-1">
                    <div *ngIf="loginForm.get('password')?.errors?.['required']" appTranslate="LOGIN.PASSWORD_REQUIRED">
                        La contraseña es requerida
                    </div>
                </div>
            </div>

            <!-- Botón de Inicio de Sesión -->
            <button type="submit"
                class="w-full bg-black rounded-lg text-white font-bold py-3 px-4  transition duration-200 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="loginForm.invalid" appTranslate="LOGIN.LOGIN_BUTTON">
                Iniciar Sesión
            </button>

            <div class="text-center text-white font-bold text-sm">
                <span appTranslate="LOGIN.NO_ACCOUNT">¿No tienes una cuenta?</span>
                <a href="register" class="text-black font-bold" appTranslate="LOGIN.REGISTER_LINK">Regístrate</a>
            </div>
        </form>

        <div class="mt-6  text-center">
            <p class="text-xs font-bold text-white">
                <span appTranslate="LOGIN.TERMS_TEXT">Al iniciar sesión aceptas nuestros</span>
                <a (click)="regulation()" class="text-black hover:underline" appTranslate="LOGIN.TERMS_LINK">Términos y
                    Condiciones</a>
            </p>
        </div>
    </div>
    <div class="absolute bottom-0 right-0 z-2 w-1/4 max-w-lg">
        <img src="assets/img/der.svg" alt="Granos de café" class="w-full h-auto" />
    </div>

    <!-- Imagen decorativa superior izquierda -->
    <div class="absolute top-10 left-8 z-1 w-1/4 max-w-lg">
        <img src="assets/img/izq.svg" alt="Hoja de café" class="w-full h-auto" />
    </div>
</div>
