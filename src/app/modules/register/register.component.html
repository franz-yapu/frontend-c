<div class="min-h-screen flex flex-col md:flex-row">
    <!-- Sección de imagen (oculta en móviles) -->
    <div class="hidden md:block md:w-1/2 bg-cover bg-center" style="background-image: url('assets/img/fondo.jpg');">
        <div class="h-full bg-amber-900/30 flex items-center justify-center p-12">
            <div class="text-white text-center max-w-md">
                <h1 class="text-4xl font-bold mb-4">Bienvenido </h1>
            </div>
        </div>
    </div>

    <!-- Sección del formulario -->
    <div class="w-full md:w-1/2 flex items-center justify-center md:p-8 bg-white">
        <div class="max-w-md w-full rounded-lg">
            <!-- Botón para volver atrás -->
            <button (click)="home()" class="flex items-center text-amber-700 hover:text-amber-900 ">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Volver atrás
            </button>

            <div class="text-center ">
                <h2 class="text-3xl font-bold text-amber-900">Registro</h2>
            </div>

            <dynamic-form [fields]="PatientsFormFields(catalogs)" [initialData]="initiaData"
                [askfor]="onFormCreated" (onFormChange)="handleFormChange($event)">
            </dynamic-form>

            <!-- Contenedor de botones -->
            <div class="mx-5 px-2 flex flex-col space-y-4">
                <button 
                    (click)="save()" 
                    [disabled]="!formData?.valid || !valid" 
                    class="w-full py-3 px-5 rounded-lg transition duration-200 font-medium
                        disabled:bg-gray-400 disabled:cursor-not-allowed
                        bg-green-700 hover:bg-green-800 text-white shadow-md hover:shadow-lg">
                    Registrarse
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de confirmación de registro - FONDO TRANSPARENTE -->
<div *ngIf="showSuccessModal" class="fixed inset-0 bg-transparent flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full transform transition-all duration-300 scale-100 border border-gray-200">
        <!-- Header del modal -->
        <div class="bg-gradient-to-r from-amber-700 to-amber-900 rounded-t-xl p-6 text-center">
            <div class="w-16 h-16 bg-white bg-opacity-20 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-white mb-2">¡Registro Exitoso!</h3>
            <p class="text-amber-100">Hemos enviado un correo de confirmación</p>
        </div>

        <!-- Contenido del modal -->
        <div class="p-6">
            <div class="text-center mb-6">
                <p class="text-gray-600 mb-4">
                    Te hemos enviado un correo electrónico a:
                </p>
                <p class="text-amber-700 font-semibold text-lg bg-amber-50 py-2 px-4 rounded-lg border border-amber-200">
                    {{ registeredEmail }}
                </p>
            </div>

            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg mb-6">
                <div class="flex items-start">
                    <svg class="w-5 h-5 text-blue-500 mt-0.5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <div>
                        <p class="text-blue-800 text-sm font-medium">
                            En las próximas <span class="font-bold">24 horas</span> recibirás una notificación confirmando si tu registro ha sido validado.
                        </p>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-center text-sm text-gray-500 mb-2">
                <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                Revisa tu bandeja de entrada y carpeta de spam
            </div>
        </div>

        <!-- Footer del modal -->
        <div class="bg-gray-50 rounded-b-xl px-6 py-4 border-t border-gray-200">
            <button 
                (click)="closeModal()"
                class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-opacity-50">
                Entendido
            </button>
        </div>
    </div>
</div>
