<div class="min-h-screen flex items-center justify-center p-4 bg-cover bg-center" 
     style="background-image: url('assets/img/fondo.jpg');">
     
    <!-- Overlay semi-transparente para mejorar legibilidad -->
    <div class="absolute inset-0 bg-amber-900/30"></div>
    
    <div class="max-w-md w-full p-8 bg-white/90 backdrop-blur-sm rounded-lg shadow-2xl border border-amber-100 relative z-10">
        
        <!-- Indicador de verificación exitosa -->
        <div *ngIf="tokenVerified" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-center">
            <i class="fas fa-check-circle mr-2"></i>
            ¡Cuenta verificada exitosamente!
        </div>

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-amber-900">Iniciar Sesión</h2>
            <p class="text-amber-700 mt-2">Accede a tu cuenta para continuar</p>
        </div>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Campo Email -->
            <div>
                <label class="block text-amber-900 font-medium mb-2">Correo Electrónico</label>
                <input 
                    type="email" 
                    formControlName="email"
                    class="w-full px-4 py-3 rounded-lg border border-amber-300 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition"
                    placeholder="tucorreo@ejemplo.com"
                >
                <!-- Mensajes de validación para email -->
                <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)"
                     class="text-red-500 text-sm mt-1">
                    <div *ngIf="loginForm.get('email')?.errors?.['required']">
                        El correo electrónico es requerido
                    </div>
                    <div *ngIf="loginForm.get('email')?.errors?.['email']">
                        Por favor ingresa un correo electrónico válido
                    </div>
                </div>
            </div>
            
            <!-- Campo Contraseña -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-amber-900 font-medium">Contraseña</label>
                </div>
                <input 
                    type="password" 
                    formControlName="password"
                    class="w-full px-4 py-3 rounded-lg border border-amber-300 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition"
                    placeholder="••••••••"
                >
                <!-- Mensajes de validación para contraseña -->
                <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
                     class="text-red-500 text-sm mt-1">
                    <div *ngIf="loginForm.get('password')?.errors?.['required']">
                        La contraseña es requerida
                    </div>
                </div>
            </div>
            
            <!-- Botón de Inicio de Sesión -->
            <button 
                type="submit" 
                class="w-full bg-green-900 hover:bg-green-800 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="loginForm.invalid"
            >
                Iniciar Sesión
            </button>
            
            <div class="text-center text-amber-700 text-sm">
                ¿No tienes una cuenta? 
                <a href="register" class="text-green-700 hover:text-green-800 font-medium">Regístrate</a>
            </div>
        </form>
        
        <div class="mt-6 pt-6 border-t border-amber-200 text-center">
            <p class="text-xs text-amber-600">Al iniciar sesión aceptas nuestros 
                <a (click)="regulation()" class="text-green-900 hover:underline">Términos y Condiciones</a>
            </p>
        </div>
    </div>
</div>
