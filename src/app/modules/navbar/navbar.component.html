<nav
  class="bg-primary-900 shadow-lg md:shadow-none md:fixed md:inset-y-0 md:left-0 md:w-64 md:border-r md:border-primary-800 transition-all duration-300"
>
  <!-- Mobile header -->
  <div
    class="md:hidden flex justify-between items-center px-4 py-4 bg-primary-900"
  >
    <span class="font-bold text-xl tracking-wide text-white">
      @if ((branding$ | async)?.logoUrl) {
        <img
          [src]="(branding$ | async)?.logoUrl"
          class="h-8 w-auto inline mr-2"
        />
      }
      <span class="text-secondary-200" appTranslate="APP.TITLE_ACCENT">Café</span>
    </span>
    <button (click)="toggleMenu()" class="text-secondary-200 hover:text-white">
      <svg
        [class.hidden]="isMenuOpen"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
      <svg
        [class.hidden]="!isMenuOpen"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <div [class.hidden]="!isMenuOpen" class="md:block md:h-full flex flex-col">
    <!-- Logo desktop -->
    <div
      class="hidden md:flex items-center justify-center py-6 px-4 border-b border-primary-800"
    >
      <div class="flex items-center space-x-3">
        <a class="flex flex-col items-center">
          <img
            [src]="
              (branding$ | async)?.logoUrl || 'assets/img/caritas/logo.png'
            "
            alt="Logo"
            class="h-16 w-auto rounded-lg shadow-md bg-surface p-1 mb-2"
          />
          <span class="font-bold text-lg tracking-wide text-white">
            <span appTranslate="APP.TITLE">Altura</span> <span class="text-secondary-300" appTranslate="APP.TITLE_ACCENT">Café</span>
          </span>
        </a>
      </div>
    </div>

    <!-- Menú -->
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-1">
      @for (item of menuItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-white/10 text-white font-bold"
          class="flex items-center text-white/80 hover:bg-white/5 hover:text-white px-4 py-3 rounded-lg transition-all duration-200"
        >
          <span class="material-symbols-outlined mr-3">{{ item.icon }}</span>
          <span [appTranslate]="item.translateKey">{{ item.title }}</span>
        </a>
      }
    </div>

    <!-- Footer -->
    <div class="px-4 py-4 border-t border-primary-800 bg-black/20 mt-auto">
      <div class="flex items-center">
        <div class="flex-shrink-0">
          <div
            class="h-10 w-10 rounded-full bg-secondary-500 flex items-center justify-center text-white font-medium"
          >
            {{ getUserInitials() }}
          </div>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium text-white">
            {{ user?.firstName }} {{ user?.lastName }}
          </p>
          <button
            (click)="logout()"
            class="text-xs text-secondary-200 hover:text-white flex items-center transition-colors duration-200"
          >
            <span appTranslate="NAV.LOGOUT">Cerrar sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
